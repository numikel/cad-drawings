name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: slow tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install "ezdxf>=1.4.4" pypdfium2 pillow matplotlib jsonschema pytest ruff
      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: python -m pip install "pywin32>=312"
      - name: Lint
        run: python -m ruff check skills
      - name: Format check
        run: python -m ruff format --check skills
      - name: Forbidden strings and files
        run: python skills/cad-drawings/tests/check_forbidden.py
      - name: Tests (COM tests are deselected by pyproject addopts)
        run: python -m pytest skills/cad-drawings/tests -q

  validate-skill:
    name: validate skill (reference validator)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # skills-ref requires Python >= 3.11
      - name: Install the reference validator (PyPI package skills-ref, CLI agentskills)
        run: python -m pip install "skills-ref==0.1.1"
      - name: Validate skills/cad-drawings
        run: agentskills validate skills/cad-drawings

  minimal-dependencies:
    name: imports with required dependencies only
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Create a venv with only the required dependencies
        run: |
          python -m venv "$RUNNER_TEMP/minimal"
          "$RUNNER_TEMP/minimal/bin/python" -m pip install "ezdxf>=1.4.4" pypdfium2 pillow
      - name: Import test (optional packages must stay lazy)
        run: |
          "$RUNNER_TEMP/minimal/bin/python" - <<'PY'
          import json
          import subprocess
          import sys

          sys.path.insert(0, "skills/cad-drawings/scripts")
          import cad

          commands = cad.load_commands()
          assert commands, "no commands registered"
          optional = {"matplotlib", "pymupdf", "fitz", "jsonschema", "win32com", "pythoncom"}
          loaded = sorted(optional & set(sys.modules))
          assert not loaded, f"optional packages imported at import time: {loaded}"

          script = "skills/cad-drawings/scripts/cad.py"
          proc = subprocess.run([sys.executable, script, "--help"], capture_output=True, text=True)
          assert proc.returncode == 0 and "Traceback" not in proc.stderr, proc.stderr

          # doctor must work before anything optional is installed (stdlib only)
          proc = subprocess.run(
              [sys.executable, "skills/cad-drawings/scripts/doctor.py"],
              capture_output=True,
              text=True,
          )
          assert "Traceback" not in proc.stderr, proc.stderr
          assert "status" in json.loads(proc.stdout), proc.stdout
          print("ok:", sorted(commands))
          PY

  slow:
    name: slow tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install "ezdxf>=1.4.4" pypdfium2 pillow matplotlib jsonschema pytest
      - name: Slow tests
        env:
          CAD_DRAWINGS_RUN_SLOW: "1"
        run: python -m pytest skills/cad-drawings/tests -q -m "slow and not com"
