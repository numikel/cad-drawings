name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: slow tests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install "ezdxf>=1.4.4" pypdfium2 pillow matplotlib jsonschema pytest ruff
      - name: Install Windows-only dependencies
        if: runner.os == 'Windows'
        run: python -m pip install "pywin32>=312"
      - name: Lint
        run: python -m ruff check skills
      - name: Format check
        run: python -m ruff format --check skills
      - name: Forbidden strings and files
        run: python skills/cad-drawings/tests/check_forbidden.py
      - name: Tests (COM tests are deselected by pyproject addopts)
        run: python -m pytest skills/cad-drawings/tests -q

  validate-skill:
    name: validate skill (reference validator)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # skills-ref requires Python >= 3.11
      - name: Install the reference validator (PyPI package skills-ref, CLI agentskills)
        run: python -m pip install "skills-ref==0.1.1"
      - name: Validate skills/cad-drawings
        run: agentskills validate skills/cad-drawings

  minimal-dependencies:
    name: required dependencies only, and no dependencies at all
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Create venvs (required dependencies only, and the bare standard library)
        run: |
          python -m venv "$RUNNER_TEMP/required"
          "$RUNNER_TEMP/required/bin/python" -m pip install "ezdxf>=1.4.4" pypdfium2 pillow matplotlib
          python -m venv "$RUNNER_TEMP/bare"
      - name: Import test (optional packages must stay lazy)
        run: |
          "$RUNNER_TEMP/required/bin/python" - <<'PY'
          import subprocess
          import sys

          sys.path.insert(0, "skills/cad-drawings/scripts")
          import cad

          commands = cad.load_commands()
          assert commands, "no commands registered"
          optional = {"pymupdf", "fitz", "jsonschema", "win32com", "pythoncom"}
          loaded = sorted(optional & set(sys.modules))
          assert not loaded, f"optional packages imported at import time: {loaded}"
          proc = subprocess.run(
              [sys.executable, "skills/cad-drawings/scripts/cad.py", "--help"],
              capture_output=True,
              text=True,
          )
          assert proc.returncode == 0 and "Traceback" not in proc.stderr, proc.stderr
          print("ok:", sorted(commands))
          PY
      - name: Render a generated fixture with the required dependencies
        env:
          CAD_DRAWINGS_RUNS: ${{ runner.temp }}/runs
        run: |
          PY="$RUNNER_TEMP/required/bin/python"
          "$PY" skills/cad-drawings/evals/make_fixtures.py --out "$RUNNER_TEMP/fixtures"
          "$PY" skills/cad-drawings/scripts/cad.py render "$RUNNER_TEMP/fixtures/sheet_set.dxf"             --backend ezdxf > "$RUNNER_TEMP/render.json"
          "$PY" - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["RUNNER_TEMP"], "render.json").read_text("utf-8"))
          assert data["status"] == "ok" and data["exit_code"] == 0, data
          assert data["approximate"] is True, data
          pngs = [Path(o["path"]) for o in data["outputs"].values() if o["path"].endswith(".png")]
          assert len(pngs) == 2 and all(p.stat().st_size > 1000 for p in pngs), pngs
          PY
      - name: doctor and cleanup --list work with nothing installed (stdlib only)
        run: |
          BARE="$RUNNER_TEMP/bare/bin/python"
          for args in "doctor" "cleanup --list"; do
            set +e
            CAD_DRAWINGS_RUNS="$RUNNER_TEMP/bare-runs" "$BARE" skills/cad-drawings/scripts/cad.py $args               > "$RUNNER_TEMP/out.json" 2> "$RUNNER_TEMP/err.txt"
            code=$?
            set -e
            echo "cad.py $args -> exit $code"
            if grep -q Traceback "$RUNNER_TEMP/err.txt" "$RUNNER_TEMP/out.json"; then
              cat "$RUNNER_TEMP/err.txt"; echo "traceback in output"; exit 1
            fi
            if [ "$code" != "0" ] && [ "$code" != "3" ]; then echo "unexpected exit code"; exit 1; fi
            "$BARE" -c "import json,sys; d=json.load(open(sys.argv[1], encoding='utf-8')); assert 'status' in d"               "$RUNNER_TEMP/out.json"
          done
          "$BARE" skills/cad-drawings/scripts/doctor.py > "$RUNNER_TEMP/doctor.json"
          "$BARE" -c "import json,sys; assert 'status' in json.load(open(sys.argv[1], encoding='utf-8'))"             "$RUNNER_TEMP/doctor.json"

  slow:
    name: slow tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install "ezdxf>=1.4.4" pypdfium2 pillow matplotlib jsonschema pytest
      - name: Slow tests
        env:
          CAD_DRAWINGS_RUN_SLOW: "1"
        run: python -m pytest skills/cad-drawings/tests -q -m "slow and not com"
