name: release

# Runs only when a version tag such as v0.1.0 (or v0.2.0-rc.1) is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install "ezdxf>=1.4.4" pypdfium2 pillow matplotlib jsonschema pytest
      - name: The tag must equal the version in every file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, "skills/cad-drawings/scripts")
          from cadlib import __version__ as lib
          tag = os.environ["TAG"].removeprefix("v")
          skill = re.search(r'^\s+version:\s*"?([^"\s]+)"?\s*$', open("skills/cad-drawings/SKILL.md", encoding="utf-8").read().split("---", 2)[1], re.M).group(1)
          plugin = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"]
          found = {"tag": tag, "SKILL.md": skill, "cadlib": lib, "plugin.json": plugin}
          print(found)
          if len(set(found.values())) != 1:
              sys.exit("version mismatch: " + str(found))
          PY
      - name: Tests
        run: python -m pytest tests -q
      - name: Build the skill archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          zip -r "cad-drawings-skill-${TAG}.zip" skills/cad-drawings -x "*/__pycache__/*" "*.pyc"
          sha256sum "cad-drawings-skill-${TAG}.zip" > "cad-drawings-skill-${TAG}.zip.sha256"
      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["TAG"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(version), text, re.S | re.M)
          if not m:
              m = re.search(r"^## \[Unreleased\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1).strip() if m else "See CHANGELOG.md.") + "\n"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" $flags --title "$TAG" --notes-file release-notes.md \
            "cad-drawings-skill-${TAG}.zip" "cad-drawings-skill-${TAG}.zip.sha256"
